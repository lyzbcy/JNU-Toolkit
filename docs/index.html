<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>人工智能2304 民主测评</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; color: #333; padding-bottom: 92px; }
  header { background: linear-gradient(135deg, #4f6ef2, #6a5cff); color: #fff; padding: 14px 16px 12px; position: sticky; top: 0; z-index: 10; }
  header .row1 { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  header h1 { font-size: 17px; }
  #refreshBtn { flex: none; background: rgba(255,255,255,.22); border: 1px solid rgba(255,255,255,.55); color: #fff; border-radius: 9px; padding: 12px 16px; font-size: 15px; font-weight: 700; line-height: 1.3; }
  .verline { font-size: 11px; opacity: .95; margin-top: 5px; background: rgba(255,255,255,.14); border-radius: 6px; padding: 5px 8px; line-height: 1.5; }
  .verline b { font-weight: 700; }
  header p { font-size: 11.5px; opacity: .92; margin-top: 5px; line-height: 1.55; }
  .card { background: #fff; border-radius: 12px; margin: 12px; padding: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .card h2 { font-size: 14px; margin-bottom: 10px; }
  select { width: 100%; padding: 12px; font-size: 16px; border: 1.5px solid #d9dce3; border-radius: 8px; background: #fff; appearance: none; }
  .quick { display: flex; gap: 8px; margin: 0 12px 8px; }
  .quick button { flex: 1; padding: 12px 0; border-radius: 10px; border: 1.5px solid #4f6ef2; color: #4f6ef2; background: #fff; font-size: 14px; font-weight: 600; line-height: 1.4; }
  .quick button small { display: block; font-size: 10px; font-weight: 400; opacity: .75; }
  .quick button.g1 { border-color: #1e8e3e; color: #1e8e3e; }
  .quick button.warn { border-color: #d9dce3; color: #888; }
  .twrap { background: #fff; border-radius: 12px; margin: 0 12px; padding: 10px 8px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  thead th { position: sticky; top: var(--hdrH, 110px); z-index: 9; background: #fff; box-shadow: 0 2px 0 #d9dce3, 0 -1px 0 #d9dce3; padding: 8px 2px; }
  th { font-size: 11px; color: #666; padding: 4px 2px 8px; }
  th:first-child, td:first-child { width: 58px; }
  th:first-child { text-align: left; padding-left: 4px; }
  th:not(:first-child) { border-left: 2px solid #e8eaf0; }
  td { vertical-align: top; }
  td.name { font-size: 13px; font-weight: 700; padding: 14px 2px 4px 4px; border-bottom: 1px solid #f2f3f5; line-height: 1.3; }
  tr:last-child td.name { border-bottom: none; }
  td:not(:first-child) { border-left: 2px solid #eef0f5; }
  .cell { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 6px 2px 10px; border-bottom: 1px solid #eef0f5; }
  tr:last-child .cell { border-bottom: none; }
  .cell button { height: 26px; border: 1px solid #e2e6ee; background: #fff; border-radius: 6px; font-size: 12px; color: #999; padding: 0; }
  .cell button.s1.sel { background: #34a853; border-color: #34a853; color: #fff; font-weight: 700; }
  .cell button.s2.sel { background: #4285f4; border-color: #4285f4; color: #fff; font-weight: 700; }
  .cell button.s3.sel { background: #f9a825; border-color: #f9a825; color: #fff; font-weight: 700; }
  .cell button.s4.sel { background: #ea4335; border-color: #ea4335; color: #fff; font-weight: 700; }
  tr.self td { opacity: .4; }
  tr.self .cell button { pointer-events: none; }
  .bar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); box-shadow: 0 -2px 10px rgba(0,0,0,.08); display: flex; gap: 10px; align-items: center; }
  .bar .prog { font-size: 11px; color: #888; width: 50px; text-align: center; flex: none; line-height: 1.4; }
  .bar button.main { flex: 1; padding: 14px 0; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; background: linear-gradient(135deg, #4f6ef2, #6a5cff); color: #fff; }
  .bar button.main:disabled { background: #c3c7d1; }
  .bar button.copy { padding: 14px 10px; border: 1.5px solid #4f6ef2; color: #4f6ef2; border-radius: 10px; background: #fff; font-size: 13px; display: none; flex: none; }
  .done { text-align: center; padding: 34px 10px; background: #fff; border-radius: 12px; margin: 12px; }
  .done b { font-size: 44px; }
  .msg { font-size: 13px; padding: 10px; border-radius: 8px; margin: 10px 12px; display: none; line-height: 1.6; }
  .msg.err { background: #fde8e8; color: #d93025; display: block; }
  .msg.ok { background: #e8f7ee; color: #1e8e3e; display: block; }
</style>
</head>
<body>
<header>
  <div class="row1">
    <h1>人工智能2304 民主测评（综测 2025-2026）</h1>
    <button id="refreshBtn" onclick="hardRefresh()">🔄 一键刷新</button>
  </div>
  <p>优10 / 良8 / 中6 / 差2。打法：先点好你觉得特别的人，再点「一键良好」或「一键优秀」补齐剩下的。每人提交一次，截止 9/16（周三）12:00。</p>
  <div class="verline">🧾 <b id="verDate">—</b>：<span id="verNote">检查更新中…</span>　⚠️ 静态网页有缓存，为获取最新消息，请勤点击右上角<b>一键强制刷新</b>。</div>
</header>

<div class="card">
  <h2>① 你是哪位？</h2>
  <select id="self" onchange="pickSelf()">
    <option value="">— 点这里选择你的姓名 —</option>
  </select>
</div>

<div class="quick" id="tools" style="display:none">
  <button class="g1" onclick="fillRest(1)">一键优秀<small>把剩下没填的全填「优」</small></button>
  <button onclick="fillRest(2)">一键良好<small>把剩下没填的全填「良」</small></button>
  <button class="warn" onclick="clearAll()">清空</button>
</div>

<div class="twrap" id="twrap" style="display:none">
  <table>
    <thead><tr>
      <th>同学</th><th>思想<br>政治</th><th>品德<br>修养</th><th>学习<br>态度</th><th>身心<br>发展</th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>
<div class="msg" id="msg"></div>
<div class="done" id="done" style="display:none"><b>✅</b><p style="margin-top:10px;font-size:15px" id="doneTxt"></p><p style="font-size:12px;color:#888;margin-top:6px">如需修改请联系班长</p></div>

<div class="bar">
  <span class="prog" id="prog"></span>
  <button class="copy" id="copyBtn" onclick="copyCode()">复制提交码</button>
  <button class="main" id="submitBtn" onclick="submit()">提交</button>
</div>

<script>
const ROSTER = ["郑晗湘","甘思源","马承芳","俞思瑶","郭馨怡","李慧茹","张佳怡","徐昕喆","林俊凌","雷震","邢宇","梁文博","蒋宇恒","杭东泽","曾子翔","刘知润","王铖","余恩泽","邹炜琪","孟浩明","许麟杰","孙以恒","李俊洋","王嵩羽","张步云","李子康","王承厚","韩烨磊","卢子良","魏征征","赵星","赵燕玲"];
const DIMS = ["思想政治", "品德修养", "学习态度", "身心发展"];
const WEBHOOK = "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=72bbb44c-0db0-4e45-a213-876e35630727";
const IS_TEST = new URLSearchParams(location.search).has("test");
const grades = {};
let me = "";

/* ===== 强制刷新组件（版本自动核对 + 防循环 + 更新日志） =====
   改版时: 同步更新 PAGE_VERSION 和 version.json 的 version/changelog */
const PAGE_VERSION = 6;
function checkVersion() {
  fetch("version.json?t=" + Date.now())
    .then(r => r.json())
    .then(remote => {
      const note = document.getElementById("verNote"), vd = document.getElementById("verDate");
      if (remote.version !== undefined) {
        vd.textContent = "最近更新 " + (remote.date || "");
        note.textContent = (remote.changelog || [])[0] || "";
      }
      const remoteV = parseInt(remote.version || 0, 10);
      if (remoteV > PAGE_VERSION) {
        // 防循环: 每个目标版本每会话最多自动刷新一次
        const key = "mzc_refreshed_for";
        if (sessionStorage.getItem(key) !== String(remoteV)) {
          sessionStorage.setItem(key, String(remoteV));
          const p = new URLSearchParams(location.search);
          p.set("v", remoteV + "." + Date.now());
          location.replace(location.pathname + "?" + p.toString());
        }
      }
    })
    .catch(() => { document.getElementById("verNote").textContent = "（更新检查失败，不影响填写）"; });
}
checkVersion();

ROSTER.forEach(n => { grades[n] = [0, 0, 0, 0]; const o = document.createElement("option"); o.value = n; o.textContent = n; document.getElementById("self").appendChild(o); });
fitSticky();

function fitSticky() {
  const h = document.querySelector("header").offsetHeight;
  document.documentElement.style.setProperty("--hdrH", h + 2 + "px");
}
window.addEventListener("resize", fitSticky);
function hardRefresh() {
  const p = new URLSearchParams(location.search);
  p.set("v", Date.now());
  location.replace(location.pathname + "?" + p.toString());
}
function pickSelf() {
  me = document.getElementById("self").value;
  document.getElementById("tools").style.display = me ? "flex" : "none";
  document.getElementById("twrap").style.display = me ? "block" : "none";
  const tb = document.getElementById("tbody");
  tb.innerHTML = "";
  ROSTER.forEach(name => {
    const tr = document.createElement("tr");
    if (name === me) tr.className = "self";
    let html = `<td class="name">${name}${name === me ? '<br><span style="font-size:10px;color:#999;font-weight:400">自己·免填</span>' : ""}</td>`;
    for (let d = 0; d < 4; d++) {
      html += `<td><div class="cell">`;
      [1, 2, 3, 4].forEach(v => { html += `<button class="s${v}" data-n="${name}" data-d="${d}" data-v="${v}" onclick="pick(this)">${"优良中差"[v - 1]}</button>`; });
      html += `</div></td>`;
    }
    tr.innerHTML = html;
    tb.appendChild(tr);
  });
  if (localStorage.getItem("mzc_done_" + me)) showDone("你之前已经提交过了");
}
function pick(btn) {
  const n = btn.dataset.n, d = +btn.dataset.d, v = +btn.dataset.v;
  const off = grades[n][d] === v;
  grades[n][d] = off ? 0 : v;
  btn.parentElement.querySelectorAll("button").forEach(b => b.classList.remove("sel"));
  if (!off) btn.classList.add("sel");
  progress();
}
function setCell(n, d, v) {
  grades[n][d] = v;
  const btn = document.querySelector(`button[data-n="${n}"][data-d="${d}"][data-v="${v}"]`);
  if (btn) { btn.parentElement.querySelectorAll("button").forEach(b => b.classList.remove("sel")); btn.classList.add("sel"); }
}
function fillRest(v) {
  ROSTER.forEach(n => { if (n !== me) for (let d = 0; d < 4; d++) if (!grades[n][d]) setCell(n, d, v); });
  progress();
}
function clearAll() {
  ROSTER.forEach(n => { grades[n] = [0, 0, 0, 0]; });
  document.querySelectorAll(".cell button.sel").forEach(b => b.classList.remove("sel"));
  progress();
}
function progress() {
  let filled = 0, total = (ROSTER.length - 1) * 4;
  ROSTER.forEach(n => { if (n !== me) grades[n].forEach(v => { if (v) filled++; }); });
  document.getElementById("prog").innerHTML = me ? `${filled}<br>/ ${total}` : "";
}
function buildCode() {
  const rows = DIMS.map((_, d) => ROSTER.map(n => (n === me ? 0 : grades[n][d])).join("")).join("|");
  return (IS_TEST ? "MZC-TEST" : "MZC") + "|" + me + "|" + rows;
}
function showMsg(text, ok) {
  const m = document.getElementById("msg");
  m.className = "msg " + (ok ? "ok" : "err");
  m.textContent = text;
}
function showDone(txt) {
  document.getElementById("twrap").style.display = "none";
  document.getElementById("tools").style.display = "none";
  document.getElementById("done").style.display = "block";
  document.getElementById("doneTxt").textContent = txt + "！辛苦了～";
  const btn = document.getElementById("submitBtn");
  btn.disabled = true; btn.textContent = "已提交";
}
function submit() {
  if (!me) return showMsg("请先选择你的姓名", false);
  const missNames = ROSTER.filter(n => n !== me && grades[n].some(v => !v));
  if (missNames.length) {
    return showMsg(`还有 ${missNames.length} 位同学没打完（${missNames.slice(0, 5).join("、")}${missNames.length > 5 ? " 等" : ""}）。点「一键良好」或「一键优秀」即可补齐。`, false);
  }
  const btn = document.getElementById("submitBtn");
  btn.disabled = true; btn.textContent = "提交中…";
  fetch(WEBHOOK, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ msgtype: "text", text: { content: (IS_TEST ? "【测试】" : "【民主测评】") + buildCode() } })
  }).then(() => {
    localStorage.setItem("mzc_done_" + me, "1");
    showDone("提交成功");
  }).catch(() => {
    btn.disabled = false; btn.textContent = "提交";
    document.getElementById("copyBtn").style.display = "block";
    showMsg("网络提交失败。请点「复制提交码」，把内容发给班长QQ。", false);
  });
}
function copyCode() {
  navigator.clipboard.writeText(buildCode()).then(() => showMsg("已复制，去QQ发给班长吧", true));
}
</script>
</body>
</html>
