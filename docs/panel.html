<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>综测评议小组打分（2.1 日常考核55分）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; color: #333; padding-bottom: 92px; }
  header { background: linear-gradient(135deg, #0f766e, #0891b2); color: #fff; padding: 14px 16px 12px; position: sticky; top: 0; z-index: 10; }
  header .row1 { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  header h1 { font-size: 17px; }
  #refreshBtn { flex: none; background: rgba(255,255,255,.22); border: 1px solid rgba(255,255,255,.55); color: #fff; border-radius: 9px; padding: 12px 16px; font-size: 15px; font-weight: 700; }
  header p { font-size: 11.5px; opacity: .92; margin-top: 5px; line-height: 1.55; }
  .card { background: #fff; border-radius: 12px; margin: 12px; padding: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .card h2 { font-size: 14px; margin-bottom: 10px; }
  input[type=text] { width: 100%; padding: 12px; font-size: 16px; border: 1.5px solid #d9dce3; border-radius: 8px; }
  .tip { font-size: 12px; color: #888; margin-top: 8px; line-height: 1.6; }
  .quick { display: flex; gap: 8px; margin: 0 12px 8px; }
  .quick button { flex: 1; padding: 11px 0; border-radius: 10px; border: 1.5px solid #0f766e; color: #0f766e; background: #fff; font-size: 14px; font-weight: 600; line-height: 1.4; }
  .quick button small { display: block; font-size: 10px; font-weight: 400; opacity: .75; }
  .quick button.warn { border-color: #d9dce3; color: #888; }
  .twrap { background: #fff; border-radius: 12px; margin: 0 12px; padding: 10px 8px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  thead th { position: sticky; top: var(--hdrH, 108px); z-index: 9; background: #fff; box-shadow: 0 2px 0 #d9dce3, 0 -1px 0 #d9dce3; padding: 8px 2px; }
  th { font-size: 11px; color: #666; }
  th:first-child, td:first-child { width: 64px; }
  th:first-child { text-align: left; padding-left: 4px; }
  th:not(:first-child) { border-left: 2px solid #e8eaf0; }
  td { vertical-align: top; }
  td.name { font-size: 13px; font-weight: 700; padding: 16px 2px 4px 4px; border-bottom: 1px solid #f2f3f5; line-height: 1.3; }
  tr:last-child td.name { border-bottom: none; }
  td:not(:first-child) { border-left: 2px solid #eef0f5; }
  .cell { display: flex; gap: 4px; padding: 8px 4px 12px; border-bottom: 1px solid #eef0f5; }
  tr:last-child .cell { border-bottom: none; }
  .cell input { width: 100%; height: 34px; border: 1.5px solid #e2e6ee; border-radius: 6px; font-size: 15px; text-align: center; }
  .cell input:focus { outline: none; border-color: #0f766e; }
  tr.self td { opacity: .4; }
  tr.self .cell input { pointer-events: none; }
  .bar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); box-shadow: 0 -2px 10px rgba(0,0,0,.08); display: flex; gap: 10px; align-items: center; }
  .bar .prog { font-size: 11px; color: #888; width: 50px; text-align: center; flex: none; line-height: 1.4; }
  .bar button.main { flex: 1; padding: 14px 0; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; background: linear-gradient(135deg, #0f766e, #0891b2); color: #fff; }
  .bar button.main:disabled { background: #c3c7d1; }
  .bar button.copy { padding: 14px 10px; border: 1.5px solid #0f766e; color: #0f766e; border-radius: 10px; background: #fff; font-size: 13px; display: none; flex: none; }
  .done { text-align: center; padding: 34px 10px; background: #fff; border-radius: 12px; margin: 12px; }
  .done b { font-size: 44px; }
  .msg { font-size: 13px; padding: 10px; border-radius: 8px; margin: 10px 12px; display: none; line-height: 1.6; }
  .msg.err { background: #fde8e8; color: #d93025; display: block; }
  .msg.ok { background: #e8f7ee; color: #1e8e3e; display: block; }
</style>
</head>
<body>
<header>
  <div class="row1">
    <h1>综测评议小组打分（日常考核 55 分）</h1>
    <button id="refreshBtn" onclick="hardRefresh()">🔄 一键刷新</button>
  </div>
  <p>仅限评议小组成员填写。给全班每人三项打分：思想品德 0–15 / 集体活动 0–20 / 出勤 0–20。<b>自己那行自动免填（本人回避）</b>。截止：与综测材料相同，9/16（周三）12:00。</p>
  <div class="verline" style="font-size:11px;opacity:.95;margin-top:5px;background:rgba(255,255,255,.14);border-radius:6px;padding:5px 8px;line-height:1.5">⚠️ 静态网页有缓存，为获取最新消息，请勤点击右上角<b>一键强制刷新</b>。</div>
</header>

<div class="card">
  <h2>① 输入你的名字</h2>
  <input type="text" id="me" placeholder="评议人姓名（如：张三 / 班主任）" onchange="pickSelf()">
  <div class="tip">班主任不在线上填的话，把三个数字发班长代录即可。</div>
</div>

<div class="quick" id="tools" style="display:none">
  <button onclick="fillRest(12, 16, 16)">一键默认<small>未填的填 12 / 16 / 16</small></button>
  <button class="warn" onclick="clearAll()">清空</button>
</div>

<div class="twrap" id="twrap" style="display:none">
  <table>
    <thead><tr><th>同学</th><th>思想品德<br>0-15</th><th>集体活动<br>0-20</th><th>出勤<br>0-20</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>
<div class="msg" id="msg"></div>
<div class="done" id="done" style="display:none"><b>✅</b><p style="margin-top:10px;font-size:15px" id="doneTxt"></p></div>

<div class="bar">
  <span class="prog" id="prog"></span>
  <button class="copy" id="copyBtn" onclick="copyCode()">复制提交码</button>
  <button class="main" id="submitBtn" onclick="submit()">提交</button>
</div>

<script>
const ROSTER = ["郑晗湘","甘思源","马承芳","俞思瑶","郭馨怡","李慧茹","张佳怡","徐昕喆","林俊凌","雷震","邢宇","梁文博","蒋宇恒","杭东泽","曾子翔","刘知润","王铖","余恩泽","邹炜琪","孟浩明","许麟杰","孙以恒","李俊洋","王嵩羽","张步云","李子康","王承厚","韩烨磊","卢子良","魏征征","赵星","赵燕玲"];
const MAX = [15, 20, 20];
const WEBHOOK = "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=72bbb44c-0db0-4e45-a213-876e35630727";
const grades = {};
let me = "";

ROSTER.forEach(n => { grades[n] = [null, null, null]; });

function hardRefresh() {
  const p = new URLSearchParams(location.search);
  p.set("v", Date.now());
  location.replace(location.pathname + "?" + p.toString());
}
function fitSticky() {
  const h = document.querySelector("header").offsetHeight;
  document.documentElement.style.setProperty("--hdrH", h + 2 + "px");
}
window.addEventListener("resize", fitSticky);
fitSticky();

function pickSelf() {
  me = document.getElementById("me").value.trim();
  if (!me) return;
  document.getElementById("tools").style.display = "flex";
  document.getElementById("twrap").style.display = "block";
  const tb = document.getElementById("tbody");
  tb.innerHTML = "";
  ROSTER.forEach(name => {
    const tr = document.createElement("tr");
    if (name === me) tr.className = "self";
    let html = `<td class="name">${name}${name === me ? '<br><span style="font-size:10px;color:#999;font-weight:400">本人回避</span>' : ""}</td>`;
    for (let d = 0; d < 3; d++) {
      html += `<td><div class="cell"><input type="number" min="0" max="${MAX[d]}" inputmode="numeric" data-n="${name}" data-d="${d}" placeholder="0-${MAX[d]}" oninput="onNum(this)"></div></td>`;
    }
    tr.innerHTML = html;
    tb.appendChild(tr);
  });
  if (localStorage.getItem("mzc2_done_" + me)) showDone("你之前已经提交过了");
}
function onNum(inp) {
  const n = inp.dataset.n, d = +inp.dataset.d;
  let v = inp.value === "" ? null : parseInt(inp.value, 10);
  if (v !== null && (isNaN(v) || v < 0)) { v = 0; inp.value = 0; }
  if (v !== null && v > MAX[d]) { v = MAX[d]; inp.value = MAX[d]; }
  grades[n][d] = v;
  progress();
}
function fillRest(a, b, c) {
  ROSTER.forEach(n => { if (n !== me) for (let d = 0; d < 3; d++) if (grades[n][d] === null) { grades[n][d] = [a, b, c][d]; document.querySelector(`input[data-n="${n}"][data-d="${d}"]`).value = [a, b, c][d]; } });
  progress();
}
function clearAll() {
  ROSTER.forEach(n => { grades[n] = [null, null, null]; });
  document.querySelectorAll(".cell input").forEach(i => i.value = "");
  progress();
}
function progress() {
  let filled = 0, total = (ROSTER.length - 1) * 3;
  ROSTER.forEach(n => { if (n !== me) grades[n].forEach(v => { if (v !== null) filled++; }); });
  document.getElementById("prog").innerHTML = me ? `${filled}<br>/ ${total}` : "";
}
function buildCode() {
  const nums = [];
  ROSTER.forEach(n => { for (let d = 0; d < 3; d++) nums.push(n === me ? -1 : (grades[n][d] === null ? -1 : grades[n][d])); });
  return "MZC2|" + me + "|" + nums.join(",");
}
function showMsg(text, ok) {
  const m = document.getElementById("msg");
  m.className = "msg " + (ok ? "ok" : "err");
  m.textContent = text;
}
function showDone(txt) {
  document.getElementById("twrap").style.display = "none";
  document.getElementById("tools").style.display = "none";
  document.getElementById("done").style.display = "block";
  document.getElementById("doneTxt").textContent = txt + "！辛苦了～";
  const btn = document.getElementById("submitBtn");
  btn.disabled = true; btn.textContent = "已提交";
}
function submit() {
  if (!me) return showMsg("请先输入你的名字", false);
  const miss = ROSTER.filter(n => n !== me && grades[n].some(v => v === null));
  if (miss.length) {
    return showMsg(`还有 ${miss.length} 位同学没打完（${miss.slice(0, 5).join("、")}${miss.length > 5 ? " 等" : ""}）。点「一键默认」补齐即可。`, false);
  }
  const btn = document.getElementById("submitBtn");
  btn.disabled = true; btn.textContent = "提交中…";
  fetch(WEBHOOK, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ msgtype: "text", text: { content: "【评议打分】" + buildCode() } })
  }).then(() => {
    localStorage.setItem("mzc2_done_" + me, "1");
    showDone("提交成功");
  }).catch(() => {
    btn.disabled = false; btn.textContent = "提交";
    document.getElementById("copyBtn").style.display = "block";
    showMsg("网络提交失败。请点「复制提交码」，把内容发给班长QQ。", false);
  });
}
function copyCode() {
  navigator.clipboard.writeText(buildCode()).then(() => showMsg("已复制，去QQ发给班长吧", true));
}
</script>
</body>
</html>
